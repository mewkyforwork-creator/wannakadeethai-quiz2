<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คลังคำถามวรรณคดีไทย ป.4-6 (100 ข้อ)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chonburi&family=Sarabun:wght@400;500;700&display=swap');

  :root{
    --ink:#2a1505;
    --paper:#f3e7cf;
    --paper-deep:#e8d4ac;
    --gold:#b8860b;
    --gold-soft:#d4a93b;
    --maroon:#7a1f14;
    --maroon-deep:#5a160e;
    --jade:#1f6e54;
    --jade-soft:#2e8f6f;
    --line:#caa86a;
    --shadow:rgba(60,30,5,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Sarabun',sans-serif;
    background:
      radial-gradient(circle at 15% 12%, rgba(184,134,11,.10), transparent 40%),
      radial-gradient(circle at 85% 88%, rgba(122,31,20,.10), transparent 42%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .frame{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg,#fbf3e1,#f0e2c6);
    border:2px solid var(--line);
    border-radius:20px;
    box-shadow:0 18px 50px var(--shadow), inset 0 0 0 6px rgba(255,255,255,.35);
    overflow:hidden;
    position:relative;
  }
  .frame::before{
    content:"";position:absolute;inset:10px;border:1px dashed rgba(184,134,11,.45);
    border-radius:14px;pointer-events:none;z-index:0;
  }
  header{
    background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));
    color:#f6e6c8;padding:26px 24px 22px;text-align:center;position:relative;z-index:1;
  }
  header .kanok{font-size:22px;letter-spacing:6px;opacity:.7}
  header h1{
    font-family:'Chonburi',serif;font-size:clamp(22px,5.5vw,32px);
    margin:4px 0 6px;color:#ffe9c0;text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  header p{font-size:14px;opacity:.85}
  .pad{padding:24px 22px 28px;position:relative;z-index:1}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .pill{font-weight:700;font-size:14px;background:var(--paper-deep);border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--maroon)}
  .pill.score{background:var(--jade);color:#eafaf2;border-color:var(--jade-soft)}
  .bar{flex:1;height:10px;background:var(--paper-deep);border-radius:999px;border:1px solid var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .4s ease}

  .qcat{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--gold);padding:4px 12px;border-radius:6px;margin-bottom:12px}
  .qtext{font-size:clamp(18px,4.2vw,21px);font-weight:700;line-height:1.5;margin-bottom:18px;color:var(--ink)}

  .choices{display:flex;flex-direction:column;gap:11px}
  .choice{text-align:left;font-family:inherit;font-size:16px;font-weight:500;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:12px;transition:.15s}
  .choice:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 14px var(--shadow)}
  .choice:disabled{cursor:default}
  .choice .lab{flex:none;width:30px;height:30px;border-radius:8px;background:var(--paper-deep);color:var(--maroon);font-weight:700;display:grid;place-items:center;font-size:15px}
  .choice.correct{background:#e7f6ee;border-color:var(--jade);color:var(--jade)}
  .choice.correct .lab{background:var(--jade);color:#fff}
  .choice.wrong{background:#fbe9e6;border-color:var(--maroon);color:var(--maroon)}
  .choice.wrong .lab{background:var(--maroon);color:#fff}
  .choice.dim{opacity:.55}

  .feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px;line-height:1.55;background:var(--paper-deep);border-left:5px solid var(--gold);display:none}
  .feedback.show{display:block;animation:pop .3s ease}
  .feedback b{color:var(--maroon)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .nav{margin-top:18px;text-align:right}
  .btn{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));color:#ffe9c0;border:none;padding:12px 26px;border-radius:12px;box-shadow:0 6px 16px var(--shadow);transition:.15s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.ghost{background:var(--jade)}

  .center{text-align:center}
  .center .lead{font-size:16px;line-height:1.7;margin:14px 0 22px;color:#5a3a18}
  .scoreBig{font-family:'Chonburi',serif;font-size:54px;color:var(--maroon);margin:6px 0}
  .medal{font-size:60px;margin:8px 0}
  .ribbon{display:inline-block;background:var(--gold);color:#fff;font-weight:700;padding:8px 22px;border-radius:8px;margin-bottom:8px;font-size:18px}
  .opts{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto 22px}
  .opt{font-family:inherit;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--maroon);transition:.15s}
  .opt:hover{border-color:var(--gold);transform:translateY(-2px)}
  .opt.sel{background:var(--jade);color:#fff;border-color:var(--jade-soft)}
  footer{text-align:center;font-size:12px;color:#8a6a3a;padding:0 0 16px;position:relative;z-index:1}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="kanok">๐ ๐ ๐</div>
    <h1>วรรณคดีไทยพาเพลิน</h1>
    <p>แบบทดสอบวรรณคดีไทย ป.4–6 · 100 ข้อรวด</p>
  </header>
  <div class="pad" id="app"></div>
  <footer>จัดทำโดย ครูหมิว · โรงเรียนบ้านขามป้อม</footer>
</div>

<script>
/* ===== คลังคำถาม 100 ข้อ ===== */
const BANK = [
    {cat:"รามเกียรติ์",q:"ทหารเอกผู้ซื่อสัตย์ของพระราม กายเป็นลิงเผือก คือใคร?",c:["ทศกัณฐ์","หนุมาน","สุครีพ","พาลี"],a:1,e:"หนุมานเป็นทหารเอกของพระราม กายสีขาว มีฤทธิ์เหาะได้ ซื่อสัตย์ภักดีต่อพระราม"},
    {cat:"รามเกียรติ์",q:"ยักษ์เจ้ากรุงลงกาที่ลักพานางสีดาไปคือใคร?",c:["กุมภกรรณ","อินทรชิต","ทศกัณฐ์","มารีศ"],a:2,e:"ทศกัณฐ์ พญายักษ์สิบหน้ายี่สิบมือ เจ้ากรุงลงกา ผู้ลักนางสีดา"},
    {cat:"รามเกียรติ์",q:"นางเอกของเรื่องรามเกียรติ์คือใคร?",c:["นางสีดา","นางมณโฑ","นางสำมนักขา","นางเบญกาย"],a:0,e:"นางสีดาเป็นชายาของพระราม ถูกทศกัณฐ์ลักพาตัวไปลงกา"},
    {cat:"รามเกียรติ์",q:"พระรามเป็นอวตารของเทพองค์ใด?",c:["พระอิศวร","พระนารายณ์","พระพรหม","พระอินทร์"],a:1,e:"พระรามคืออวตารปางหนึ่งของพระนารายณ์ที่ลงมาปราบทศกัณฐ์"},
    {cat:"รามเกียรติ์",q:"สะพานที่กองทัพลิงสร้างข้ามทะเลไปลงกาเรียกว่าอะไร?",c:["ถนนพระราม","สะพานหิน","ถมมหาสมุทร","สะพานสายรุ้ง"],a:2,e:"กองทัพลิงช่วยกันถมมหาสมุทร (จองถนน) ด้วยหินเพื่อข้ามไปลงกา"},
    {cat:"รามเกียรติ์",q:"น้องชายผู้ซื่อสัตย์ที่ติดตามพระรามออกเดินป่าคือใคร?",c:["พระพรต","พระลักษมณ์","พระสัตรุด","สุครีพ"],a:1,e:"พระลักษมณ์ติดตามพระรามและนางสีดาออกเดินป่าด้วยความจงรักภักดี"},
    {cat:"รามเกียรติ์",q:"ใครเป็นผู้เผากรุงลงกาด้วยหางที่ติดไฟ?",c:["องคต","หนุมาน","ชมพูพาน","นิลพัท"],a:1,e:"หนุมานถูกจับเผาหาง แต่กลับใช้หางที่ติดไฟเผากรุงลงกาแทน"},
    {cat:"รามเกียรติ์",q:"นางยักษ์ที่แปลงกายเป็นนางสีดาปลอมเพื่อลวงพระรามคือใคร?",c:["นางเบญกาย","นางมณโฑ","นางสำมนักขา","นางกาลอัคคี"],a:0,e:"นางเบญกายแปลงเป็นสีดาปลอมลอยน้ำมาลวงพระราม"},
    {cat:"พระอภัยมณี",q:"พระอภัยมณีมีความสามารถพิเศษด้านใด?",c:["เป่าปี่","ตีกลอง","ร่ายมนตร์","แปลงกาย"],a:0,e:"พระอภัยมณีเรียนวิชาเป่าปี่จนเสียงปี่สะกดใจคนและสัตว์ได้"},
    {cat:"พระอภัยมณี",q:"นางยักษ์ที่จับพระอภัยมณีไว้เป็นสามีคือใคร?",c:["นางละเวง","ผีเสื้อสมุทร","นางสุวรรณมาลี","นางวาลี"],a:1,e:"ผีเสื้อสมุทรเป็นนางยักษ์ที่จับพระอภัยมณีไว้ นางเงือกช่วยพาหนี"},
    {cat:"พระอภัยมณี",q:"ม้านิลมังกรเป็นพาหนะของตัวละครใด?",c:["สินสมุทร","สุดสาคร","พระอภัยมณี","อุศเรน"],a:1,e:"สุดสาคร บุตรพระอภัยมณีกับนางเงือก ขี่ม้านิลมังกรและมีไม้เท้าวิเศษ"},
    {cat:"พระอภัยมณี",q:"พระอภัยมณีกับศรีสุวรรณมีความสัมพันธ์กันอย่างไร?",c:["พ่อลูก","พี่น้อง","เพื่อน","ลุงหลาน"],a:1,e:"ศรีสุวรรณเป็นน้องชายของพระอภัยมณี ผู้เรียนวิชากระบี่กระบอง"},
    {cat:"พระอภัยมณี",q:"ใครแต่งเรื่องพระอภัยมณี?",c:["ศรีปราชญ์","สุนทรภู่","พระยาตรัง","เจ้าฟ้ากุ้ง"],a:1,e:"พระอภัยมณีเป็นนิทานคำกลอนผลงานชิ้นเอกของสุนทรภู่"},
    {cat:"พระอภัยมณี",q:"สินสมุทรเป็นบุตรของพระอภัยมณีกับใคร?",c:["นางเงือก","ผีเสื้อสมุทร","นางสุวรรณมาลี","นางละเวง"],a:1,e:"สินสมุทรเป็นบุตรพระอภัยมณีกับผีเสื้อสมุทร มีกำลังมากแต่ใจดี"},
    {cat:"พระอภัยมณี",q:"นางละเวงวัณฬาเป็นเจ้าเมืองใด?",c:["ผลึก","ลังกา","รมจักร","การะเวก"],a:1,e:"นางละเวงวัณฬาเป็นเจ้าเมืองลังกา ผู้ทำสงครามกับฝ่ายพระอภัยมณี"},
    {cat:"สังข์ทอง",q:"พระสังข์ออกมาจากสิ่งใดเมื่อแรกเกิด?",c:["ดอกบัว","หอยสังข์","ไข่","ผลไม้"],a:1,e:"นางจันท์เทวีคลอดบุตรเป็นหอยสังข์ เมื่อกะเทาะออกมาจึงเป็นกุมารรูปงาม"},
    {cat:"สังข์ทอง",q:"พระสังข์ปลอมตัวเป็นเจ้าเงาะด้วยการสวมอะไร?",c:["หน้ากากทอง","รูปเงาะ","ผ้าคลุม","มงกุฎ"],a:1,e:"พระสังข์สวมรูปเงาะปิดบังรูปงามไว้ จึงถูกเรียกว่าเจ้าเงาะ"},
    {cat:"สังข์ทอง",q:"นางที่เลือกเจ้าเงาะเป็นคู่ครองคือใคร?",c:["นางรจนา","นางจันท์เทวี","นางมณฑา","นางเกสร"],a:0,e:"นางรจนาเสี่ยงพวงมาลัยเลือกเจ้าเงาะ เพราะมองเห็นรูปทองที่ซ่อนอยู่ภายใน"},
    {cat:"สังข์ทอง",q:"เรื่องสังข์ทองมาจากชาดกใด?",c:["เวสสันดรชาดก","สุวรรณสังขชาดก","มหาชนกชาดก","เตมียชาดก"],a:1,e:"สังข์ทองมีเค้าโครงจากสุวรรณสังขชาดกในปัญญาสชาดก"},
    {cat:"สังข์ทอง",q:"ท้าวสามนต์มีความสัมพันธ์กับนางรจนาอย่างไร?",c:["เป็นพ่อ","เป็นพี่","เป็นลุง","เป็นสามี"],a:0,e:"ท้าวสามนต์เป็นพระบิดาของนางรจนา ผู้จัดพิธีเลือกคู่ให้ธิดา"},
    {cat:"อิเหนา",q:"บทละครเรื่องอิเหนาเป็นพระราชนิพนธ์ในรัชกาลใด?",c:["รัชกาลที่ ๑","รัชกาลที่ ๒","รัชกาลที่ ๓","รัชกาลที่ ๕"],a:1,e:"อิเหนาเป็นพระราชนิพนธ์ในพระบาทสมเด็จพระพุทธเลิศหล้านภาลัย รัชกาลที่ ๒"},
    {cat:"อิเหนา",q:"คู่หมั้นเดิมของอิเหนาที่อิเหนาไม่ยอมแต่งงานด้วยคือใคร?",c:["บุษบา","จินตะหรา","ดรสา","สการะวาตี"],a:0,e:"บุษบาเป็นคู่หมั้นเดิมของอิเหนา แต่อิเหนาหลงรักจินตะหราจึงไม่ยอมแต่ง"},
    {cat:"อิเหนา",q:"เรื่องอิเหนามีต้นเค้ามาจากนิทานของชาติใด?",c:["อินเดีย","จีน","ชวา (อินโดนีเซีย)","เปอร์เซีย"],a:2,e:"อิเหนามีต้นเค้าจากนิทานปันหยีของชวา (อินโดนีเซีย)"},
    {cat:"อิเหนา",q:"อิเหนาใช้ชื่อปลอมว่าอะไรเมื่อปลอมตัวเป็นโจร?",c:["มิสาระปันหยี","ปันหยี","ระตู","กะหรัดตะปาตี"],a:0,e:"อิเหนาปลอมตัวเป็นโจรป่าใช้ชื่อ มิสาระปันหยี"},
    {cat:"ขุนช้างขุนแผน",q:"นางเอกของเรื่องขุนช้างขุนแผนคือใคร?",c:["นางวันทอง","นางลาวทอง","นางแก้วกิริยา","นางสร้อยฟ้า"],a:0,e:"นางวันทอง เดิมชื่อนางพิมพิลาไลย เป็นนางเอกของเรื่อง"},
    {cat:"ขุนช้างขุนแผน",q:"นางวันทองเดิมมีชื่อว่าอะไร?",c:["นางพิม","นางลาว","นางแก้ว","นางสร้อย"],a:0,e:"นางวันทองเดิมชื่อนางพิมพิลาไลย ภายหลังเปลี่ยนชื่อเป็นวันทอง"},
    {cat:"ขุนช้างขุนแผน",q:"ขุนแผนมีดาบวิเศษชื่อว่าอะไร?",c:["ฟ้าฟื้น","ฟ้าลั่น","เพชรพระอุมา","กายสิทธิ์"],a:0,e:"ขุนแผนมีดาบวิเศษชื่อ ดาบฟ้าฟื้น พร้อมม้าสีหมอกและกุมารทอง"},
    {cat:"ขุนช้างขุนแผน",q:"ม้าคู่ใจของขุนแผนชื่ออะไร?",c:["สีหมอก","นิลมังกร","ดาวดึงส์","พายุ"],a:0,e:"ม้าสีหมอกเป็นม้าคู่ใจของขุนแผน"},

/* ===== ตรรกะเกม: เล่นทั้ง 100 ข้อรวดเดียว ===== */
const app = document.getElementById('app');
let pool=[], idx=0, score=0, answered=false;

function start(){
  app.innerHTML=`
    <div class="center">
      <div style="font-size:56px">๏ 📜 ๏</div>
      <p class="lead">แบบทดสอบวรรณคดีไทย ป.4–6 ทั้งหมด <b>${BANK.length} ข้อ</b><br>
      เล่นรวดเดียวจบ มีเฉลยพร้อมคำอธิบายทุกข้อ<br>
      ครอบคลุมรามเกียรติ์ พระอภัยมณี สังข์ทอง อิเหนา<br>
      สุภาษิต คำประพันธ์ โวหาร ราชาศัพท์ และอื่น ๆ</p>
      <button class="btn" onclick="begin()">เริ่มเล่นเลย ▸</button>
    </div>`;
}

function begin(){
  pool = BANK;
  idx=0; score=0;
  render();
}

function render(){
  answered=false;
  const Q=pool[idx];
  const pct=(idx/pool.length)*100;
  app.innerHTML=`
    <div class="topbar">
      <span class="pill">ข้อ ${idx+1}/${pool.length}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="pill score">⭐ ${score}</span>
    </div>
    <span class="qcat">${Q.cat}</span>
    <div class="qtext">${Q.q}</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb"></div>
    <div class="nav"><button class="btn" id="next" disabled onclick="next()">${idx===pool.length-1?'ดูผลคะแนน 🏆':'ข้อต่อไป ▸'}</button></div>`;
  const box=document.getElementById('choices');
  const labels=['ก','ข','ค','ง'];
  Q.c.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='choice';
    b.innerHTML=`<span class="lab">${labels[i]}</span><span>${c}</span>`;
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
}

function pick(i){
  if(answered) return;
  answered=true;
  const Q=pool[idx];
  const labels=['ก','ข','ค','ง'];
  [...document.querySelectorAll('.choice')].forEach((b,j)=>{
    b.disabled=true;
    if(j===Q.a) b.classList.add('correct');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb=document.getElementById('fb');
  if(i===Q.a){score++;fb.innerHTML=`✅ <b>ถูกต้อง!</b> ${Q.e}`;}
  else fb.innerHTML=`❌ <b>ยังไม่ถูก</b> · คำตอบที่ถูกคือ ข้อ ${labels[Q.a]}. ${Q.e}`;
  fb.classList.add('show');
  document.getElementById('next').disabled=false;
}

function next(){idx++; if(idx<pool.length) render(); else result();}

function result(){
  const n=pool.length, r=score/n;
  let medal,title,msg;
  if(r===1){medal="🏆";title="ยอดเยี่ยมที่สุด!";msg="เก่งมาก! ตอบถูกทุกข้อ เป็นปราชญ์วรรณคดีตัวจริง";}
  else if(r>=0.8){medal="🥇";title="เก่งมาก!";msg="ความรู้วรรณคดีแน่นมาก อีกนิดเดียวก็เต็ม";}
  else if(r>=0.6){medal="🥈";title="ดีมาก!";msg="ทำได้ดีเลย ลองทบทวนข้อที่พลาดอีกหน่อยนะ";}
  else if(r>=0.4){medal="🥉";title="พอใช้ได้";msg="มาถูกทางแล้ว อ่านวรรณคดีเพิ่มอีกหน่อยจะเก่งขึ้นแน่นอน";}
  else {medal="📚";title="สู้ ๆ นะ";msg="ไม่เป็นไร ลองอ่านทบทวนแล้วเล่นใหม่อีกครั้งได้เลย";}
  app.innerHTML=`
    <div class="center">
      <div class="medal">${medal}</div>
      <div class="ribbon">${title}</div>
      <div class="scoreBig">${score} / ${n}</div>
      <p class="lead">${msg}</p>
      <button class="btn ghost" onclick="begin()">เล่นใหม่อีกครั้ง ↺</button>
    </div>`;
}

start();
</script>
